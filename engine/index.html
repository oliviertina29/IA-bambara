  T(st.head,540,400,S(E.outBack(P(lt,0,0.4))));const after=lt>st.r;
  st.opts.forEach((o,i)=>{const good=i===st.ans;const k=E.outBack(P(lt,0.1+i*0.08,0.5+i*0.08));
    T(o.el,540+(after&&!good?0:0),o.y,S(k*(after?(good?1.08+0.03*Math.sin(lt*6):0.9):1)));
    o.el.style.opacity=after&&!good?0.35:1;o.ring.setAttribute('opacity',after&&good?(0.7+0.3*Math.sin(lt*8)).toFixed(2):'0');
    const m=E.outElastic(P(lt,st.r,st.r+0.8));(good?o.ok:o.no).setAttribute('transform',`translate(370 0) scale(${(after?m*.9:0.001).toFixed(3)})`)});
  const y0=st.opts[st.ans]?st.opts[st.ans].y:800;
  st.cf.forEach(c=>{const d=lt-st.r;show(c.el,d>0&&d<2);if(d<=0)return;T(c.el,540+Math.cos(c.a)*c.v*d,y0+Math.sin(c.a)*c.v*d+300*d*d,1,c.rot*d)});
 }};

/* ---- outro : robot waves, confetti, follow button ---- */
LIB.outro={
 build(g,p){
  const f=add(g,`<g><rect x="-290" y="-52" width="580" height="104" rx="52" fill="#E4572E" filter="url(#shadow)"/>
   <g transform="translate(-225 0)"><circle r="30" fill="#fff"/><path d="M-13 0 H13 M0 -13 V13" stroke="#E4572E" stroke-width="7" stroke-linecap="round"/></g>
   <text x="30" y="16" text-anchor="middle" font-size="44" fill="#fff">${esc(p.cta||'Aw ye an tugu!')}</text></g>`);
  const ask=p.ask?add(g,`<g><rect x="-380" y="-60" width="760" height="120" rx="60" fill="#FFF1D6" filter="url(#shadow)"/>${icon('chat',.9).replace('<g ','<g transform="translate(-310 0) scale(.9)" ')}<text x="30" y="17" text-anchor="middle" font-size="${p.ask.length>20?38:46}" fill="#1B1E42">${esc(p.ask)}</text></g>`):null;
  const r=rng(21),cols=['#F2A541','#5FF2EE','#E4572E','#FFF1D6','#2FB36B'];const conf=[];
  for(let i=0;i<80;i++)conf.push({el:add(g,`<rect x="-9" y="-5" width="18" height="10" rx="3" fill="${cols[i%5]}"/>`),x:r()*1080,t0:.2+r()*2.2,v:420+r()*380,rot:(r()-.5)*900,sw:20+r()*50,ph:r()*6});
  const hearts=[];for(let i=0;i<7;i++)hearts.push({el:add(g,`<path d="M0 12 C-26 -6 -18 -30 0 -16 C18 -30 26 -6 0 12Z" fill="${i%2?'#E4572E':'#F2A541'}"/>`),t0:1.2+i*.45,dx:(i%2?1:-1)*(40+i*12)});
  return{f,conf,hearts,ask}},
 render(st,lt,len,t){
  setRobot({t,x:540,y:700+Math.sin(lt*3)*8,s:.9*E.outBack(P(lt,0.1,0.8)),armL:22+Math.sin(lt*3)*5,armR:lt>0.6?-150+Math.sin(lt*10)*24:-14,happy:talking(t)===0,core:.6+.3*Math.sin(lt*5),halo:.6,headR:Math.sin(lt*5)*5});
  T(st.f,540,1085,S(E.outElastic(P(lt,1.0,2.0)))*(1+.05*Math.sin(lt*6)));
  if(st.ask)T(st.ask,540,330,S(E.outBack(P(lt,0.3,0.8))),Math.sin(lt*3)*2);
  st.conf.forEach(c=>{const d=lt-c.t0;show(c.el,d>0);if(d<=0)return;T(c.el,c.x+Math.sin(d*3+c.ph)*c.sw,-40+d*c.v,1,c.rot*d,Math.cos(d*6+c.ph))});
  st.hearts.forEach(h=>{const d=lt-h.t0;const k=P(d,0,1.6);show(h.el,k>0&&k<1);if(k<=0||k>=1)return;
    T(h.el,760+h.dx*k+Math.sin(d*5)*14,1060-k*380,.8+k*.8,Math.sin(d*4)*14);h.el.style.opacity=1-k});
 }};

/* ======================= background, wipes, subtitles ======================= */
const PART=[];(()=>{const r=rng(7),g=$('particles');const cols=['#F2A541','#5FF2EE','#FFF1D6','#E4572E'];
 for(let i=0;i<30;i++)PART.push({el:add(g,`<circle r="${(3+r()*7).toFixed(1)}" fill="${cols[i%4]}" opacity="${(.12+r()*.25).toFixed(2)}"/>`),x:r()*1080,y:r()*2000,s:15+r()*35,ph:r()*6.28})})();
function renderBG(t){for(const p of PART){p.el.setAttribute('cx',(p.x+Math.sin(t*.6+p.ph)*24).toFixed(1));p.el.setAttribute('cy',((((p.y-t*p.s)%2100)+2100)%2100-90).toFixed(1))}
  $('bogRect').setAttribute('transform',`translate(${(t*8)%140} ${(-t*14)%140})`)}
const WCOL=[['#F2A541','#5FF2EE'],['#5FF2EE','#E4572E'],['#E4572E','#F2A541']];
function renderWipe(t,SC){let r1=0,r2=0;const R=1400;
  SC.slice(1).forEach(([b],i)=>{if(t>b-0.6&&t<b+0.6){$('w1').setAttribute('fill',WCOL[i%3][0]);$('w2').setAttribute('fill',WCOL[i%3][1]);
    if(t<b){r2=R*E.inOutCubic(P(t,b-0.55,b-0.08));r1=R*E.inOutCubic(P(t,b-0.42,b))}else{r1=R*(1-E.inOutCubic(P(t,b,b+0.42)));r2=R*(1-E.inOutCubic(P(t,b+0.06,b+0.55)))}}});
  $('w1').setAttribute('r',r1.toFixed(1));$('w2').setAttribute('r',r2.toFixed(1))}
function buildSubs(scenes){const root=$('subs');return scenes.map(sc=>{
  const box=document.createElement('div');box.className='sub';root.appendChild(box);
  const bm=document.createElement('div');bm.className='bm';box.appendChild(bm);const words=[];const re=/\[([^\]]+)\]|(\S+)/g;let m;
  const txt=(sc.bm||[]).map(c=>typeof c==='string'?c:c.text).join(' ');
  while((m=re.exec(txt))){const hl=!!m[1];
    if(!hl&&/^[!?.,:;]+$/.test(m[2])&&words.length){words[words.length-1].textContent+=m[2];continue}
    (m[1]||m[2]).split(' ').forEach(w=>{if(words.length)bm.appendChild(document.createTextNode(' '));
      const sp=document.createElement('span');sp.className='w'+(hl?' hl':'');sp.textContent=w;bm.appendChild(sp);words.push(sp)})}
  const fr=document.createElement('div');fr.className='fr';fr.textContent=sc.fr||'';box.appendChild(fr);if(!sc.fr)fr.style.display='none';
  return{box,words,fr}})}
function renderSubs(SUB,t,si,SC,WT){
  SUB.forEach((s,i)=>{s.box.style.display=i===si?'block':'none'});const s=SUB[si],st=SC[si][0],lt=t-st;
  if(!s.words.length){s.box.style.display='none';return}
  const bp=E.outBack(P(lt,0.15,0.6));s.box.style.opacity=P(lt,0.15,0.4);s.box.style.transform=`scale(${(0.9+0.1*bp).toFixed(4)})`;
  const W=WT[si]||[];
  s.words.forEach((w,k)=>{const t0=(W[k]??W[W.length-1]??st+0.4+k*0.15)-st;const p=P(lt,t0,t0+0.38);const e=E.outBack(p);
    w.style.opacity=p.toFixed(3);w.style.transform=`translateY(${((1-e)*26).toFixed(2)}px) scale(${(0.7+0.3*e).toFixed(4)})`;
    if(w.classList.contains('hl')){const g=Math.max(0,Math.sin((lt-t0)*3))*0.5;w.style.textShadow=`0 0 ${(18*g).toFixed(1)}px rgba(242,165,65,${g.toFixed(2)})`}});
  const f0=(W.length?W[W.length-1]-st:1)+0.4;const fp=P(lt,f0,f0+0.5);s.fr.style.opacity=fp;s.fr.style.transform=`translateY(${((1-E.outCubic(fp))*14).toFixed(2)}px)`}

/* ======================= master ======================= */
let STATE=null;
function init(EP,TM){
  const SC=TM.sc;CLAUSES=(TM.clauses||[]).flat();
  $('tagA').textContent=EP.tag||'IA · Bamanankan na';$('tagB').textContent=EP.lesson!=null?`Kalan ${EP.lesson}`:'';if(EP.lesson==null)$('tagB').style.display='none';
  const under=$('under');
  const scenes=EP.scenes.map((sc,i)=>{const type=LIB[sc.type]?sc.type:'robot_says';const g=add(under,'<g style="display:none"></g>');
    const len=SC[i][1]-SC[i][0];const ctx={len,clauses:(TM.clauses[i]||[]).map(([a,b])=>[a-SC[i][0],b-SC[i][0]])};
    const st=LIB[type].build(g,sc.params||{},ctx);
    let bg=null;if(sc.image_file){bg=document.createElementNS('http://www.w3.org/2000/svg','g');g.insertBefore(bg,g.firstChild);
      bg.innerHTML=`<image href="${sc.image_file}" x="-60" y="-100" width="1200" height="2120" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="0" width="1080" height="1920" fill="#0d0f24" opacity=".42"/><rect x="0" y="1150" width="1080" height="770" fill="#0d0f24" opacity=".35"/>`}
    return{type,g,st,ctx,bg,overlay:ctx.overlay}});
  STATE={EP,TM,SC,scenes,SUB:buildSubs(EP.scenes),DUR:SC[SC.length-1][1],TYPES:window.SCENE_TYPES||{}};
  window.DUR=STATE.DUR;
}
function render(t){
  const {SC,scenes,SUB,TM}=STATE;t=cl(t,0,STATE.DUR);let si=SC.findIndex(s=>t<s[1]);if(si<0)si=SC.length-1;
  renderBG(t);renderWipe(t,SC);
  scenes.forEach((s,i)=>{show(s.g,i===si);if(s.overlay)show(s.overlay,i===si)});show(RB.g,false);
  const s=scenes[si],lt=t-SC[si][0],len=SC[si][1]-SC[si][0];
  if(s.bg){const k=lt/len;s.bg.firstChild.setAttribute('transform',`translate(${(-20*k).toFixed(1)} ${(-30*k).toFixed(1)}) scale(${(1+0.1*k).toFixed(4)})`)}
  LIB[s.type].render(s.st,lt,len,t);
  const hasRobot=(STATE.TYPES[s.type]||{}).robot;if(!hasRobot)narrator(t,lt);
  renderSubs(SUB,t,si,SC,TM.words||[]);
  $('tag').style.opacity=1;
}
window.render=render;window.init=init;

/* preview mode: open engine/index.html?preview with episode + timing loaded by preview.js */
if(window.EPISODE&&window.TIMING){init(window.EPISODE,window.TIMING);
  if(!location.search.includes('capture')){const fit=()=>{const s=Math.min(innerWidth/1080,innerHeight/1920);const w=$('wrap');w.style.transform=`scale(${s})`;w.style.marginLeft=((innerWidth-1080*s)/2)+'px'};
    addEventListener('resize',fit);fit();const start=performance.now();(function loop(){render(((performance.now()-start)/1000)%STATE.DUR);requestAnimationFrame(loop)})()}
  else render(0)}
</script>
