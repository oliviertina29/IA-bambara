name: Tester les voix bambara

# À lancer une fois à la main (onglet Actions) : génère des échantillons avec chaque moteur et chaque voix.
on:
  workflow_dispatch:
  push:
    paths: ["voice-tests/request.txt"]

permissions:
  contents: write

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-models-v2 }
      - name: Installer
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r pipeline/requirements.txt
      - name: Démarrer la voix Spark (MALIBA-AI, CPU)
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash pipeline/spark_server.sh
      - name: Générer les échantillons
        run: python pipeline/voice_test.py 2>&1 | tee voice-tests.log
      - name: Enregistrer
        if: always()
        run: |
          mkdir -p voice-tests && cp voice-tests.log voice-tests/log.txt || true
          tail -c 20000 /tmp/llama.log > voice-tests/llama.log 2>/dev/null || true; tail -c 20000 /tmp/gateway.log > voice-tests/gateway.log 2>/dev/null || true
          git config user.name "ia-bamanankan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f voice-tests && git commit -m "[bot] échantillons de voix [skip ci]" || true
          git pull --rebase && git push
